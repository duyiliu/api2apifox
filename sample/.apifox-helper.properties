# Apifox Helper 兼容配置样例(VS Code 版支持子集)
# 说明:这是官方 IDEA 版 Apifox Helper(easyyapi 规则引擎)的声明式子集,
# 支持 #tag / @注解#属性 / 字面量;复杂 groovy 仅支持“字符串拼接 + it.ann()”安全形态,
# 其余 groovy 会以告警提示跳过(不会静默)。详见 README「.apifox-helper.properties 支持」。

# 接口目录:@Tag(name) 已经默认作为目录;可用 folder.name 按 javadoc 的 @folder 覆盖
folder.name=#folder

# 忽略类/方法:类或方法 javadoc 写 @ignore 即跳过
ignore=#ignore

# 方法名称:javadoc @api.name 覆盖接口名
api.name=#api.name

# 字段忽略:名为 ignoreLog 的字段不出现在模型中
field.ignore=ignoreLog

# 字段输出名:@fieldName 覆盖属性名(如 JSON 命名不一致时)
field.name=#fieldName

# 字段描述:字段 javadoc 里写 @fieldDesc 追加说明(有已有描述则换行追加)
field.description=#fieldDesc

# 字段必填:javadoc @fieldRequire 时 required=true
field.required=#fieldRequire

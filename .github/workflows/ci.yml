name: CI

# PR 与 main 分支推送都执行与发布前等价的校验,避免只在 tag 时才发现类型/测试/打包问题。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (typecheck, tests, package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check extension
        run: npm run typecheck

      - name: Run extension unit tests
        run: npm test

      - name: Bundle (esbuild)
        run: npm run compile

      - name: Verify VSIX contents
        run: npx @vscode/vsce ls --no-dependencies

  host-smoke:
    name: Extension Host smoke (VS Code 1.85)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Xvfb and Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2 libnss3

      - name: Run VS Code 1.85 Extension Host smoke
        run: xvfb-run -a npm run test:host

  cli:
    name: CLI (typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check CLI and shared core
        run: npm run typecheck:cli

      - name: Run CLI integration tests
        run: npm test --workspace @duyiliu/api2apifox

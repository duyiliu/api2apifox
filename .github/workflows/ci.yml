name: CI

# PR 与 main 分支推送都执行与发布前等价的校验,避免只在 tag 时才发现类型/测试/打包问题。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (typecheck, tests, package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check extension
        run: npm run typecheck

      - name: Run extension unit tests
        run: npm test

      - name: Bundle (esbuild)
        run: npm run compile

      - name: Verify VSIX contents
        run: npx @vscode/vsce ls --no-dependencies

  host-smoke:
    name: Extension Host smoke (VS Code 1.85)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Xvfb and Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2 libnss3

      - name: Run VS Code 1.85 Extension Host smoke
        run: xvfb-run -a npm run test:host

  cli:
    name: CLI (typecheck, tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check CLI and shared core
        run: npm run typecheck:cli

      - name: Run CLI integration tests
        run: npm test --workspace @duyiliu/api2apifox

  skill:
    name: Skill runtime (build, verify, hash)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # PR 禁止改动 runtime 产物的检查需要 merge-base,浅克隆拿不到
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # runtime 产物由 main 分支的 skill-runtime.yml 自动重建,功能 PR 一律不应携带;
      # 携带了也不会更新对(二进制不可合并),只会给并行 PR 制造必然冲突
      - name: Forbid manual runtime artifact changes in PRs
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^skills/api2apifox/runtime/'; then
            echo "::error::本 PR 改动了 skills/api2apifox/runtime 产物。产物由 main 分支 workflow 自动重建,请把这些文件恢复为与 base 分支一致后再提交(git checkout origin/${{ github.base_ref }} -- skills/api2apifox/runtime)。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # 只验证「源码能构建出版本自洽的运行时」,不再要求仓库内提交的产物是最新——
      # 产物新鲜度由 main 分支自动重建与 release.yml 的发版门禁保证
      - name: Rebuild skill runtime
        run: npm run build:skill

      - name: Verify skill runtime
        run: npm run check:skill

      - name: Run skill wrapper tests
        run: npm run test:skill

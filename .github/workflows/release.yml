name: Release Extension & Skill

# 统一版本发版：扩展与 Skill 使用同一个 vX.Y.Z tag。
# 触发方式:
# 1. 推送形如 v0.4.0 的 tag(推荐,日常发版)
# 2. 手动在 Actions 页面点 Run workflow(需要 package.json 版本高于市场已发布版本)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, Test & Publish
    # 固定 22.04:VSIX 安装门禁要跑 VS Code 1.85(Electron 25),与 ci.yml host-smoke
    # 环境对齐;ubuntu-latest(24.04+)上 libasound2 已改名 libasound2t64。
    runs-on: ubuntu-22.04
    env:
      # 未配置该 secret 时跳过 Open VSX 发布（Cursor / Windsurf / VSCodium 市场）
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          CLI_VER="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$CLI_VER" != "$PKG_VER" ]; then
            echo "::error::packages/cli/package.json version (${CLI_VER}) does not match root package.json (${PKG_VER})"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VER" != "$TAG_VER" ]; then
              echo "::error::package.json version (${PKG_VER}) does not match tag ${GITHUB_REF_NAME}"
              exit 1
            fi
          fi
          echo "VERSION=${PKG_VER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${PKG_VER}" >> "$GITHUB_ENV"
          echo "Publishing version ${PKG_VER}"

      - name: Type check extension
        run: npm run typecheck

      - name: Type check CLI and shared core
        run: npm run typecheck:cli

      - name: Run extension tests
        run: npm test

      - name: Run CLI integration tests
        run: npm test --workspace @duyiliu/api2apifox

      - name: Bundle extension (esbuild)
        run: npm run compile

      - name: Verify Skill runtime is current
        run: |
          npm run build:skill
          git diff --exit-code -- skills/api2apifox/runtime
          npm run check:skill

      - name: Package VSIX
        run: |
          VSIX_NAME="$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.vsix'")"
          echo "VSIX_NAME=${VSIX_NAME}" >> "$GITHUB_ENV"
          echo "Packaging ${VSIX_NAME}"
          npx @vscode/vsce package --no-dependencies -o "${VSIX_NAME}"

      - name: Install Xvfb and Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2 libnss3

      - name: Verify VSIX installs and activates (VS Code 1.85)
        run: xvfb-run -a npm run test:vsix -- "$VSIX_NAME"

      - name: Package Skill zip
        run: |
          cd skills
          zip -r "../api2apifox-skill-${VERSION}.zip" api2apifox

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath "$VSIX_NAME" --skip-duplicate -p "$VSCE_PAT"

      - name: Publish to Open VSX (Cursor / Windsurf / VSCodium)
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@latest publish --packagePath "$VSIX_NAME" -p "$OVSX_PAT" --skip-duplicate

      - name: Create GitHub Release with VSIX and Skill assets
        run: gh release create "$RELEASE_TAG" "$VSIX_NAME" "api2apifox-skill-${VERSION}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

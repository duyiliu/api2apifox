name: Release CLI to npm

# 触发方式:
# 1. 推送形如 cli-v0.1.0 的 tag(推荐)
# 2. 手动在 Actions 页面点 Run workflow(需要 packages/cli/package.json 版本高于 npm 已发布版本)
#
# 与 Marketplace 发布链互不影响:该工作流只认 cli-v* 标签,扩展发布只认 v* 标签。
on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, Test & Publish CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches CLI package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VER="$(node -p "require('./packages/cli/package.json').version")"
          TAG_VER="${GITHUB_REF_NAME#cli-v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::packages/cli/package.json version (${PKG_VER}) does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Publishing @duyiliu/api2apifox ${PKG_VER}"

      - name: Check whether version is already published
        id: published
        working-directory: packages/cli
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VER="$(node -p "require('./package.json').version")"
          LOOKUP="$(mktemp)"
          trap 'rm -f "$LOOKUP" "$LOOKUP.err"' EXIT
          if npm view "${PKG_NAME}@${PKG_VER}" version --json >"$LOOKUP" 2>"$LOOKUP.err"; then
            echo "已存在 ${PKG_NAME}@${PKG_VER}，跳过发布"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VER} 已存在，本次跳过上传。" >> "$GITHUB_STEP_SUMMARY"
          elif node -e 'try { process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).error?.code === "E404" ? 0 : 1); } catch { process.exit(1); }' "$LOOKUP"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$LOOKUP.err"
            echo "::error::npm registry 查询失败，停止发布。"
            exit 1
          fi

      - name: Check npm publish credentials
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::缺少仓库 secret NPM_TOKEN，无法自动发布 npm 包。"
            exit 1
          fi
          npm whoami >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Type check CLI and shared core
        run: npm run typecheck:cli

      - name: Run shared core tests
        run: npm test

      - name: Run CLI integration tests
        run: npm test --workspace @duyiliu/api2apifox

      - name: Pack and verify publish artifact
        working-directory: packages/cli
        run: |
          PACK_DIR="$(mktemp -d)"
          npm pack --pack-destination "$PACK_DIR"
          TARBALL="$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          node verify-package.js "$TARBALL"
          echo "CLI_TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish "$CLI_TARBALL" --access public
          echo "已提交 ${CLI_TARBALL##*/} 至 npm registry。" >> "$GITHUB_STEP_SUMMARY"
